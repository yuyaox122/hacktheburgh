[project]
name = "decap-agent"
version = "0.1.0"
description = "Decap agent layer: MCP tools generated from the Decap core API, a guide agent, the `decap` CLI, transcripts and replay"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ian Zhang (izhangfly)" }]
dependencies = [
  "fastmcp>=4.1,<5",                                  # Apache-2.0: MCP server/client + from_fastapi
  "pydantic-ai-slim[anthropic,openai,google,mcp]>=2.66,<3",  # MIT: provider-agnostic guide agent
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
decap = "decap_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decap_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
