[project]
name = "basic"
version = "0.1.0"
description = "bASIC: turn a chip's gate-level netlist back into readable Verilog, prove it equal with Yosys, and let AI agents (Witness) explain it"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "anthropic",                                               # the core's AI guide (basic/core/guide.py)
  "fastmcp>=4.1,<5",                                         # Apache-2.0: MCP server/client + from_fastapi
  "pydantic-ai-slim[anthropic,openai,google,mcp]>=2.66,<3",  # MIT: provider-agnostic agents
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
world = ["klayout"]                                          # minecraft/world: reads the chip GDS

[project.scripts]
basic = "basic_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["basic", "agent/basic_agent", "minecraft"]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
